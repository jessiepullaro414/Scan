[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhandscan"
version = "0.3.0"
description = "Software for the OpenHandScan handheld stereo + laser 3D scanner"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-contrib-python>=4.8",
    "pyserial>=3.5",
    "Pillow>=10",
]

[project.optional-dependencies]
fusion = ["open3d>=0.18"]
app = ["fastapi", "uvicorn", "websockets", "pywebview"]
gpu = ["pyopencl>=2024.1"]  # GPU processing on NVIDIA, AMD and Intel (ohs.compute); the CPU path needs nothing
dev = ["pytest>=7"]

[project.scripts]
ohs = "ohs.app.cli:main"

[tool.setuptools.packages.find]
include = ["ohs*"]

[tool.setuptools.package-data]
# The built desktop-app UI (npm run build in ui/); wheels built after a UI build include it
ohs = ["server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running test (deselect with -m 'not slow')",
    "hardware: needs the real scanner connected",
]
addopts = "-m \"not hardware\" -p no:dash"
