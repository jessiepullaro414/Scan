<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="OpenHandScan Studio: live 3D scanning, meshing and measuring." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>OpenHandScan Studio</title>
    <script>
      // Apply the saved theme before first paint (no flash of the wrong theme).
      try {
        var t = localStorage.getItem("ohs.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
